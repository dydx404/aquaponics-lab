# Telegraf config — MQTT consumer → InfluxDB
# Subscribes to aqua/# topics and writes measurements as aqua.<node>.<metric>

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false

# ── MQTT Consumer input ──────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  # Subscribe to all aqua topics
  topics = [
    "aqua/+/+",
    "aqua/+/+/state",
  ]

  # Topic to measurement mapping: use the full topic as measurement name
  # e.g. aqua/tank01/water_temp → measurement "aqua.tank01.water_temp"
  topic_tag = "topic"
  measurement_from_topic = true
  topic_measurement_suffix = ""

  # Parse as plain value (not JSON)
  data_format = "value"
  data_type = "float"

  # Tag the node for Grafana templating
  [inputs.mqtt_consumer.topic_parsing]
    [inputs.mqtt_consumer.topic_parsing.topic]
      measurement = "_/_/_"
      tags = ["_/_/node", "_/_/_"]

# ── InfluxDB output ──────────────────────────────────────────────────
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "aqua"
  username = "aqua"
  password = "${INFLUXDB_PASSWORD}"
  retention_policy = "autogen"
  write_consistency = "any"
  timeout = "5s"
