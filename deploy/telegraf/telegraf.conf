# Telegraf config — MQTT consumer → InfluxDB
# Subscribes to aqua/# topics and writes measurements as aqua.<node>.<metric>

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false

# ── MQTT Consumer input ──────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  # Subscribe to all aqua topics
  topics = [
    "aqua/+/+",
    "aqua/+/+/state",
  ]

  # Keep the full topic as a tag; the starlark processor below turns it into
  # the measurement name (aqua/tank01/water_temp -> aqua.tank01.water_temp).
  # NOTE: measurement_from_topic / topic_measurement_suffix are not valid
  # options in current telegraf and were removed.
  topic_tag = "topic"

  # Parse as plain value (not JSON)
  data_format = "value"
  data_type = "float"

  # Tag the node for Grafana templating (modern telegraf array-of-tables form).
  # 3-segment telemetry: aqua/<node>/<metric>
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "aqua/+/+"
    tags = "_/node/_"
  # 4-segment actuator state: aqua/<node>/<actuator>/state
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "aqua/+/+/state"
    tags = "_/node/_/_"

# ── Processor: derive measurement name from the MQTT topic ───────────
# aqua/tank01/water_temp  →  measurement "aqua.tank01.water_temp"
# Then drop the now-redundant high-cardinality "topic" tag.
[[processors.starlark]]
  source = '''
def apply(metric):
    topic = metric.tags.get("topic")
    if topic != None:
        metric.name = topic.replace("/", ".")
        metric.tags.pop("topic")
    return metric
'''

# ── InfluxDB output ──────────────────────────────────────────────────
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "aqua"
  username = "aqua"
  password = "${INFLUXDB_PASSWORD}"
  retention_policy = "autogen"
  write_consistency = "any"
  timeout = "5s"
