name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 确保没有提交 secrets.yaml
        run: |
          if git ls-files | grep -E '(^|/)secrets\.yaml$'; then
            echo "::error::secrets.yaml 不应被提交（公开仓库）"; exit 1
          fi
          echo "OK: 未跟踪 secrets.yaml"

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint (relaxed)
        run: |
          pip install yamllint
          # 放宽风格检查；ESPHome 的自定义标签不做强校验
          yamllint -d relaxed home-assistant/ firmware/esphome/ .github/workflows/ || true

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML syntax
        run: |
          pip install pyyaml
          python scripts/validate-yaml.py

  validate-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cd deploy
          cp .env.example .env
          docker compose config --quiet

  validate-mqtt-topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate MQTT topic naming
        run: |
          pip install pyyaml
          python scripts/validate-mqtt-topics.py

  simulator-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test — simulator imports and models work
        run: |
          pip install paho-mqtt pyyaml
          cd scripts/simulator
          python -c "
          import sys; sys.path.insert(0, '.')
          from aquaponics_sim.simulator import AquaponicsSimulator
          sim = AquaponicsSimulator()
          print(f'Nodes: {list(sim._models.keys())}')
          print(f'Interval: {sim.interval}s')
          # Verify model reads don't crash
          from datetime import datetime, timezone
          nm = sim._models['tank01']
          now = datetime.now(timezone.utc)
          wt = nm.water_temp.read(now)
          ph = nm.ph.read(now)
          nh3, no2, no3 = nm.nitrogen.read(0)
          _ = nm.nitrogen.read(900)
          _ = nm.pump.read()
          _ = nm.power.read_battery(now)
          _ = nm.power.read_solar_current(now)
          _ = nm.low_water.read()
          # New sensors (Task B)
          ec, tds = nm.ec_tds.read(wt, no3)
          _ = nm.turbidity.read(5.0)
          _ = nm.light.read(now)
          air_t, air_h = nm.air_th.read(now)
          _ = nm.air_pressure.read(now)
          # Actuator state (Task C)
          nm.feeder.set('ON', 0.0)
          assert nm.feeder.read() == 'ON'
          nm.feeder.set('OFF', 0.0)
          assert nm.feeder.read() == 'OFF'
          # Refill timeout
          nm.refill.set('ON', 0.0)
          assert nm.refill.check_timeout(130.0) == True
          assert nm.refill.read() == 'OFF'
          print(f'EC={ec} TDS={tds} AirT={air_t} AirH={air_h}')
          print('Smoke test OK.')
          "
